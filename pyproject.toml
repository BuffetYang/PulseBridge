[project]
name = "pulsebridge"
version = "2.1.0"
description = "本地优先的 Apple 健康数据看板（Windows 桌面端）"
readme = "README.md"
license = "MIT"
authors = [
    { name = "ypk", email = "1328291224@qq.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pyside6-essentials>=6.12.0",
    "segno>=1.6.6",
]

[project.scripts]
pulsebridge = "pulsebridge:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
